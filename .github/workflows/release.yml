name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: The tag matches the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: "*.tgz"

  github-release:
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package
      - name: Release notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" ./*.tgz --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  # npm trusted publishing needs the package to exist first; 1.0.0 went out from the owner's
  # machine. Once npmjs.com lists this repository and workflow as a trusted publisher for
  # @lumberroom/openclaw, set the repository variable PUBLISH_NPM to true.
  npm:
    needs: pack
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm publish --provenance --access public
