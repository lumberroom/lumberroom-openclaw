name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly, to catch a new OpenClaw release breaking the plugin

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The pinned host the plugin is built against, and whatever npm calls latest this week.
        openclaw: ["2026.9.6", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: OpenClaw ${{ matrix.openclaw }}
        if: matrix.openclaw != '2026.9.6'
        run: npm install --no-save "openclaw@${{ matrix.openclaw }}"
      - run: npm run typecheck
      - run: npm test
